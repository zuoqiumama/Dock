name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test
      - name: Release build
        run: cargo build --release
